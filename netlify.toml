[build]
  functions = "netlify/functions"

[[redirects]]
  from = "/api/modules/key"
  to = "/.netlify/functions/relay?path=/api/modules/key"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/relay?path=/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/appPush"
  to = "/.netlify/functions/relay?path=/appPush"
  status = 200
  force = true

[[redirects]]
  from = "/appHeart"
  to = "/.netlify/functions/relay?path=/appHeart"
  status = 200
  force = true
